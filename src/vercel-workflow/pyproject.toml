[build-system]
requires = ["hatchling>=1.27.0,<2"]
build-backend = "hatchling.build"

[project]
name = "vercel-workflow"
dynamic = ["version", "dependencies"]
description = "Python SDK for Vercel Workflows"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "LICENSE.*"]

[project.optional-dependencies]
encryption = [
    "cryptography>=48.0.1",
]

[tool.hatch.metadata.hooks.custom]
path = "hatch_build.py"

[tool.vercel.release.dependencies]
dependencies = [
    "vercel-internal-core>=0.1.0,<0.2.0",
    "vercel-oidc>=0.8.0",
    "vercel-queue>=0.8.0",
    "anyio>=4.0.0,<5",
    "httpx>=0.27.0,<1",
    "pydantic>=2.7.0,<3",
    "cbor2>=6.0,<7",
    "typing-extensions>=4.0.0,<5 ; python_version < '3.11'",
]

[tool.uv.sources]
vercel-internal-core = { workspace = true }
vercel-oidc = { workspace = true }
vercel-queue = { workspace = true }

[tool.hatch.version]
path = "vercel/workflow/version.py"

[tool.hatch.build.targets.sdist]
force-include = { "../../scripts/hatch_build.py" = "/_vercel_hatch_build.py" }
include = [
    "/vercel/workflow/**/*.py",
    "/vercel/workflow/py.typed",
    "/README.md",
    "/pyproject.toml",
    "/hatch_build.py",
    "/LICENSE",
]
exclude = ["/**/__pycache__"]

[tool.hatch.build.targets.wheel]
dev-mode-dirs = ["."]
only-include = ["/vercel/workflow"]
exclude = ["/**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--no-header --capture=tee-sys"
asyncio_mode = "auto"

[tool.poe]
include = "../../scripts/poe/poe.toml"
verbosity = -1

[tool.mypy]
cache_dir = "../../.mypy_cache/vercel-workflow"
explicit_package_bases = true
packages = ["vercel.workflow"]

[tool.poe.tasks.typecheck]
cmd = "$MYPY"
