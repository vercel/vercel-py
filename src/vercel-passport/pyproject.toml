[build-system]
requires = ["hatchling>=1.27.0,<2"]
build-backend = "hatchling.build"

[project]
name = "vercel-passport"
dynamic = ["version", "dependencies"]
description = "Passport identity helpers for Vercel Python applications"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "LICENSE.*"]

[tool.hatch.metadata.hooks.custom]
path = "hatch_build.py"

[tool.vercel.release.dependencies]
dependencies = [
    # Request tokens are always verified, so the `verify` extra is required
    # rather than optional. The lower bound is regenerated from the workspace
    # version at build time, which picks up the `issuer` option.
    "vercel-oidc[verify]>=0.10.0",
    "vercel-headers>=0.6.0",
    # 2.10 for `default_factory` that reads other fields, which derives the
    # development identity's issuer and audience from its owner and project.
    "pydantic>=2.10.0,<3",
]

[tool.uv.sources]
vercel-headers = { workspace = true }
vercel-oidc = { workspace = true }

[tool.hatch.version]
path = "vercel/passport/version.py"

[tool.hatch.build.targets.sdist]
force-include = { "../../scripts/hatch_build.py" = "/_vercel_hatch_build.py" }
include = [
    "/vercel/passport/**/*.py",
    "/vercel/passport/py.typed",
    "/README.md",
    "/pyproject.toml",
    "/hatch_build.py",
    "/LICENSE",
]
exclude = [
    "/**/__pycache__",
]

[tool.hatch.build.targets.wheel]
dev-mode-dirs = ["."]
only-include = ["/vercel/passport"]
exclude = [
    "/**/__pycache__",
]

[tool.poe]
include = "../../scripts/poe/poe.toml"
verbosity = -1

[tool.mypy]
cache_dir = "../../.mypy_cache/vercel-passport"
explicit_package_bases = true
packages = ["vercel.passport"]

[tool.poe.tasks.typecheck]
cmd = "$MYPY"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../.."]
addopts = "--no-header --capture=tee-sys"
asyncio_mode = "auto"
