[build-system]
requires = ["hatchling>=1.27.0,<2"]
build-backend = "hatchling.build"

[project]
name = "vercel-platform"
dynamic = ["version", "dependencies"]
description = "Vercel REST API clients for deployments, projects, and project routes"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "LICENSE.*"]

[tool.hatch.metadata.hooks.custom]
path = "hatch_build.py"

[tool.vercel.release.dependencies]
dependencies = [
    "httpx2>=2",
    "pydantic>=2.7.0,<3",
    "vercel-internal-core>=0.2.0,<0.4.0",
    "vercel-internal-telemetry>=0.6.0",
]

[tool.uv.sources]
vercel-internal-core = { workspace = true }
vercel-internal-telemetry = { workspace = true }

[tool.hatch.version]
path = "version.py"

[tool.hatch.build.targets.sdist]
force-include = { "../../scripts/hatch_build.py" = "/_vercel_hatch_build.py" }
include = [
    "/vercel/deployments/**",
    "/vercel/projects/**",
    "/vercel/project_routes/**",
    "/vercel/client.py",
    "/version.py",
    "/README.md",
    "/pyproject.toml",
    "/hatch_build.py",
    "/LICENSE",
]
exclude = [
    "/**/__pycache__",
]

[tool.hatch.build.targets.wheel]
dev-mode-dirs = ["."]
only-include = [
    "/vercel/deployments",
    "/vercel/projects",
    "/vercel/project_routes",
    "/vercel/client.py",
]
exclude = [
    "/**/__pycache__",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../.."]
addopts = "--no-header --capture=tee-sys"
asyncio_mode = "auto"
markers = [
    "live: requires live API credentials (VERCEL_TOKEN, VERCEL_TEAM_ID)",
]

[tool.poe]
include = "../../scripts/poe/poe.toml"
verbosity = -1

[tool.mypy]
cache_dir = "../../.mypy_cache/vercel-platform"
explicit_package_bases = true
packages = ["vercel.deployments", "vercel.projects", "vercel.project_routes"]
modules = ["vercel.client"]

[tool.poe.tasks.typecheck]
cmd = "$MYPY"
