[build-system]
requires = ["hatchling>=1.27.0,<2"]
build-backend = "hatchling.build"

[project]
name = "vercel-oidc"
dynamic = ["version", "dependencies"]
description = "OIDC helpers for Vercel Python applications"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "LICENSE.*"]

# Optional extras are static: the shared metadata hook only generates the main
# dependency table. `cryptography` is a large native wheel, so OIDC token
# signature verification is opt-in rather than a cost every dependent pays.
[project.optional-dependencies]
verify = [
    "pyjwt[crypto]>=2.13.0,<3",
    "cryptography>=48.0.1",
]

[tool.hatch.metadata.hooks.custom]
path = "hatch_build.py"

[tool.vercel.release.dependencies]
dependencies = [
    # anyio provides the backend-agnostic sleep used while waiting for another
    # caller's JWKS fetch; httpx already requires it unconditionally, so this adds
    # no install weight.
    "anyio>=4.0.0,<5",
    "httpx>=0.27.0,<1",
    "vercel-headers>=0.6.0",
]

[tool.uv.sources]
vercel-headers = { workspace = true }

[tool.hatch.version]
path = "vercel/oidc/version.py"

[tool.hatch.build.targets.sdist]
force-include = { "../../scripts/hatch_build.py" = "/_vercel_hatch_build.py" }
include = [
    "/vercel/oidc/**/*.py",
    "/README.md",
    "/vercel/oidc/py.typed",
    "/pyproject.toml",
    "/hatch_build.py",
    "/LICENSE",
]
exclude = [
    "/**/__pycache__",
]

[tool.hatch.build.targets.wheel]
dev-mode-dirs = ["."]
only-include = ["/vercel/oidc"]
exclude = [
    "/**/__pycache__",
]

[tool.poe]
include = "../../scripts/poe/poe.toml"
verbosity = -1

[tool.mypy]
cache_dir = "../../.mypy_cache/vercel-oidc"
explicit_package_bases = true
packages = ["vercel.oidc"]

[tool.poe.tasks.typecheck]
cmd = "$MYPY"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--no-header --capture=tee-sys -m 'not live'"
asyncio_mode = "auto"
markers = ["live: requires live Vercel OIDC credentials"]
