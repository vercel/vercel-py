[build-system]
requires = ["hatchling>=1.27.0,<2"]
build-backend = "hatchling.build"

[project]
name = "vercel-connect"
dynamic = ["version", "dependencies"]
description = "Python SDK for Vercel Connect"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "LICENSE.*"]

[tool.hatch.metadata.hooks.custom]
path = "hatch_build.py"

[tool.vercel.release.dependencies]
dependencies = [
    "vercel-internal-core>=0.1.0,<0.2.0",
    "vercel-oidc[verify]>=0.7.1",
    # HTTP goes through internal-core's transports, but `httpx.Response` is part
    # of this package's public surface (`ConnectApiError.response`) and is
    # imported directly, so the bound is declared rather than inherited.
    "httpx>=0.27.0,<1",
    "pydantic>=2.7.0,<3",
]

[tool.uv.sources]
vercel-internal-core = { workspace = true }
vercel-oidc = { workspace = true }

[tool.hatch.version]
path = "vercel/connect/version.py"

[tool.hatch.build.targets.sdist]
force-include = { "../../scripts/hatch_build.py" = "/_vercel_hatch_build.py" }
include = [
    "/vercel/connect/**/*.py",
    "/vercel/connect/py.typed",
    "/README.md",
    "/pyproject.toml",
    "/hatch_build.py",
    "/LICENSE",
]
exclude = ["/**/__pycache__"]

[tool.hatch.build.targets.wheel]
dev-mode-dirs = ["."]
only-include = ["/vercel/connect"]
exclude = ["/**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--no-header --capture=tee-sys -m 'not live'"
asyncio_mode = "auto"
markers = ["live: requires live Connect API credentials"]

[tool.poe]
include = "../../scripts/poe/poe.toml"
verbosity = -1

[tool.mypy]
cache_dir = "../../.mypy_cache/vercel-connect"
explicit_package_bases = true
packages = ["vercel.connect"]

[tool.poe.tasks.typecheck]
cmd = "$MYPY"
