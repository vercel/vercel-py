[build-system]
requires = ["hatchling>=1.27.0,<2"]
build-backend = "hatchling.build"

[project]
name = "vercel-blob"
dynamic = ["version", "dependencies"]
description = "Python SDK for Vercel Blob"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "LICENSE.*"]

[tool.hatch.metadata.hooks.custom]
path = "hatch_build.py"

[tool.vercel.release.dependencies]
dependencies = [
    "vercel-internal-core>=0.1.0,<0.2.0",
    "vercel-oidc>=0.8.0",
    "anyio>=4.0.0,<5",
    "httpx>=0.27.0,<1",
]

[tool.uv.sources]
vercel-internal-core = { workspace = true }
vercel-oidc = { workspace = true }

[tool.hatch.version]
path = "vercel/blob/version.py"

[tool.hatch.build.targets.sdist]
force-include = { "../../scripts/hatch_build.py" = "/_vercel_hatch_build.py" }
include = [
    "/vercel/blob/**/*.py",
    "/vercel/blob/py.typed",
    "/README.md",
    "/pyproject.toml",
    "/hatch_build.py",
    "/LICENSE",
]
exclude = ["/**/__pycache__"]

[tool.hatch.build.targets.wheel]
dev-mode-dirs = ["."]
only-include = ["/vercel/blob"]
exclude = ["/**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--no-header --capture=tee-sys -m 'not live'"
asyncio_mode = "auto"
markers = ["live: requires live Blob credentials"]

[tool.poe]
include = "../../scripts/poe/poe.toml"
verbosity = -1

[tool.poe.tasks.test-examples]
cmd = "$PYTEST -m live tests/live/test_examples.py"

[tool.mypy]
cache_dir = "../../.mypy_cache/vercel-blob"
explicit_package_bases = true
packages = ["vercel.blob"]

[tool.poe.tasks.typecheck]
cmd = "$MYPY"
