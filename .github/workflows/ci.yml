name: CI

# Pull requests run a reduced test matrix against the locked dependencies.
# Pushes to main and pull requests labelled `release` or `full-matrix` run
# every OS and Python combination. The declared dependency ranges are tested
# by dependency-bounds.yml.
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions: {}

jobs:
  lint-and-typecheck:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false

      - name: Sync dependencies
        run: uv sync --all-packages --locked --python 3.12

      - name: Lint
        run: uv run poe lint

      - name: Typecheck
        run: uv run poe typecheck

  lat-check:
    name: lat.md check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Validates links, source-symbol references, and section structure in
      # lat.md/. Lat has not tagged a release of this action yet, so it is
      # pinned to a commit and the checker version is pinned explicitly.
      - name: Check knowledge graph
        uses: vercel-labs/lat.md@1525a41cd6b51e9aa0ddddd6d849b1ba57e54d97 # main
        with:
          version: '0.1.1'

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.runner }}
    # A healthy run finishes in under 7 minutes on every OS. Without a cap, a
    # single hung test holds its matrix slot until GitHub's 6-hour default.
    timeout-minutes: 20
    environment:
      name: ci
      deployment: false
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [Linux, macOS, Windows]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # Version-specific code is exercised on Linux, so a reduced run only
        # tests macOS and Windows at the ends of the supported Python range.
        # Pushes to main and `release` or `full-matrix` PRs test them all.
        exclude: >-
          ${{ fromJSON(
            (github.event_name != 'pull_request'
              || contains(github.event.pull_request.labels.*.name, 'release')
              || contains(github.event.pull_request.labels.*.name, 'full-matrix'))
            && '[]'
            || '[
              {"os": "macOS", "python-version": "3.11"},
              {"os": "macOS", "python-version": "3.12"},
              {"os": "macOS", "python-version": "3.13"},
              {"os": "Windows", "python-version": "3.11"},
              {"os": "Windows", "python-version": "3.12"},
              {"os": "Windows", "python-version": "3.13"}
            ]'
          ) }}
        include:
          - os: Linux
            runner: ubuntu-latest
            redis-image: redis:7-alpine
            redis-url: redis://localhost:6379/9
          - os: macOS
            runner: macos-latest
            redis-image: ""
            redis-url: ""
          - os: Windows
            runner: windows-latest
            redis-image: ""
            redis-url: ""
          # Repository tooling tests do not depend on the Python version, so
          # they run in one cell per OS. Live API tests and examples hit real
          # Vercel resources, so they run in a single cell.
          - os: Linux
            python-version: "3.12"
            root-tests: true
            live: true
          - os: macOS
            python-version: "3.14"
            root-tests: true
          - os: Windows
            python-version: "3.14"
            root-tests: true
    services:
      # The vercel-apscheduler driver tests exercise their Lua scripts against
      # a real Redis on Linux; without this service they skip silently.
      redis:
        image: ${{ matrix.redis-image }} # zizmor: ignore[unpinned-images]
        ports:
          - 6379:6379
    env:
      APSCHEDULER_TEST_REDIS_URL: ${{ matrix.redis-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false

      - name: Install JavaScript interop tools
        id: js
        uses: ./.github/actions/js-interop

      - name: Sync dependencies
        run: uv sync --all-packages --locked --python ${{ matrix.python-version }}

      - name: Test
        run: |
          if [ "$ROOT_TESTS" = true ]; then
            uv run poe test
          else
            # Every workspace package, leaving out the root tooling tests.
            # shellcheck disable=SC2046
            uv run poe test $(uv workspace list)
          fi
        env:
          ROOT_TESTS: ${{ matrix.root-tests }}
          VERCEL_DEVALUE_JS: ${{ steps.js.outputs.devalue }}
          VERCEL_WORKFLOW_CLI: ${{ steps.js.outputs.workflow-cli }}
          # Where tests run under pytest (Python 3.10, which ggt does not
          # support), dump every thread's stack once a test runs this long, so
          # a hang shows where it is stuck instead of idling silently until
          # the job timeout. ggt does not read this variable.
          PYTEST_ADDOPTS: -o faulthandler_timeout=120

      - name: Live tests
        if: matrix.live
        run: uv run poe test vercel -- -m live
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Test examples
        if: matrix.live
        run: uv run poe test-examples
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  build:
    name: Build packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false

      - name: Sync dependencies
        run: uv sync --all-packages --locked --python 3.12

      - name: Build package
        run: uv run poe dist

      - name: Test bundled packages with shared AnyIO
        run: |
          for package in vercel-internal-core vercel-queue vercel-sandbox; do
            uv run python scripts/bundle_release.py test-wheel --package "$package" --dist-dir dist
          done

  release-dry-run:
    name: Release publish dry run
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false
          python-version: '3.12'

      - name: Detect release packages
        id: plan
        run: >-
          uv run --locked python scripts/publish.py detect
          --base "${{ github.event.pull_request.base.sha }}"
          --output "${{ runner.temp }}/release-plan.json"

      - name: Build release packages
        if: steps.plan.outputs.packages != '[]'
        run: >-
          uv run --locked python scripts/publish.py build
          --plan "${{ runner.temp }}/release-plan.json"
          --build-dir "${{ runner.temp }}/publish-build"

      - name: Test publishing release packages
        if: steps.plan.outputs.packages != '[]'
        run: >-
          uv run --locked python scripts/publish.py publish
          --plan "${{ runner.temp }}/publish-build/plan.json"
          --build-dir "${{ runner.temp }}/publish-build"
          --dry-run

  overall:
    name: CI Overall
    if: always()
    needs:
      - build
      - lat-check
      - lint-and-typecheck
      - test
      - release-dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check CI results
        if: >-
          needs.build.result != 'success' ||
          needs.lat-check.result != 'success' ||
          needs.lint-and-typecheck.result != 'success' ||
          needs.test.result != 'success' ||
          (needs.release-dry-run.result != 'success' && needs.release-dry-run.result != 'skipped')
        run: exit 1
