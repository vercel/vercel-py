name: CI

on:
  push:
    branches:
      - main
      # TEMPORARY: lets the test PRs based on this branch restore its cache,
      # the way pull requests will restore the cache of main. Remove before merge.
      - ricardo/turbo-ci
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions: {}

env:
  # Turborepo skips a task whose inputs match a cached run. Pull requests start
  # from the cache of the latest run on main; pushes to main and release pull
  # requests start empty, so they run every task.
  TURBO_RESTORE: >-
    ${{ github.event_name == 'pull_request' &&
    !contains(github.event.pull_request.labels.*.name, 'release') }}

jobs:
  lint-and-typecheck:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CI_PYTHON: "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          enable-cache: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Sync dependencies
        run: uv sync --all-packages --locked --python 3.12

      - name: Restore Turborepo cache
        if: env.TURBO_RESTORE == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-lint-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: turbo-lint-

      - name: Lint and typecheck
        run: scripts/turbo.sh run poe:lint poe:typecheck --continue --summarize

      - name: Report Turborepo tasks
        if: ${{ !cancelled() }}
        run: uv run --no-sync python scripts/turbo_summary.py poe:lint poe:typecheck

      - name: Save Turborepo cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-lint-${{ github.run_id }}-${{ github.run_attempt }}

  lat-check:
    name: lat.md check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Validates links, source-symbol references, and section structure in
      # lat.md/. Lat has not tagged a release of this action yet, so it is
      # pinned to a commit and the checker version is pinned explicitly.
      - name: Check knowledge graph
        uses: vercel-labs/lat.md@1525a41cd6b51e9aa0ddddd6d849b1ba57e54d97 # main
        with:
          version: '0.1.1'

  test:
    name: Test (${{ matrix.os.name }}, py${{ matrix.python-version }}, anyio ${{ matrix.anyio }})
    runs-on: ${{ matrix.os.runner }}
    # A healthy run finishes in under 7 minutes on every OS. Without a cap, a
    # single hung test holds its matrix slot until GitHub's 6-hour default.
    timeout-minutes: 20
    environment:
      name: ci
      deployment: false
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: Linux
            runner: ubuntu-latest
            redis-image: redis:7-alpine
            redis-url: redis://localhost:6379/9
          - name: macOS
            runner: macos-latest
            redis-image: ""
            redis-url: ""
          - name: Windows
            runner: windows-latest
            redis-image: ""
            redis-url: ""
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        anyio: [lowest, latest]
    services:
      # The vercel-apscheduler driver tests exercise their Lua scripts against
      # a real Redis on Linux; without this service they skip silently.
      redis:
        image: ${{ matrix.os.redis-image }} # zizmor: ignore[unpinned-images]
        ports:
          - 6379:6379
    env:
      # Keep nested task runners from restoring the locked AnyIO version.
      UV_NO_SYNC: "1"
      TURBO_CACHE_KEY: turbo-test-${{ matrix.os.name }}-py${{ matrix.python-version }}-anyio-${{ matrix.anyio }}
      ANYIO_VERSION: ${{ matrix.anyio }}
      CI_PYTHON: ${{ matrix.python-version }}
      # Tests that need credentials skip without them, so a run without
      # secrets must not share cached results with a run that has them.
      CI_LIVE_CREDENTIALS: ${{ secrets.VERCEL_TOKEN != '' }}
      APSCHEDULER_TEST_REDIS_URL: ${{ matrix.os.redis-url }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          enable-cache: false

      # The devalue interop tests run the real JS package against the Python
      # port. They skip when node is absent locally, but are mandatory here.
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # The interop tests fall back to `npm install devalue` when pointed at
      # nothing, but here we use a pinned checkout: it also carries the test
      # fixtures the tarball omits, and it keeps npm out of CI. `index.js` and
      # `src/` are byte-identical to the published package, so this ref is what
      # the port is actually verified against.
      #
      # Cloned outside the workspace deliberately. `actions/checkout` can only
      # write inside it, and a copy there puts devalue's own workflows under
      # our linters, where zizmor reports findings against them.
      - name: Checkout devalue
        run: >-
          git clone --depth 1 --branch v5.9.0
          https://github.com/sveltejs/devalue.git "$RUNNER_TEMP/devalue"

      # The local-world interop test runs the real `workflow` CLI against the
      # `.workflow-data` files the Python local world writes. Installed here
      # rather than left to the test's own npm fallback, so npm runs once per
      # job in a visible step instead of inside five test processes.
      #
      # A git checkout (as for devalue above) is not an option: the CLI is
      # TypeScript and needs a pnpm workspace install plus a tsc build, so the
      # published tarball is the practical artifact. `--ignore-scripts` skips
      # the native postinstalls of @swc/core, esbuild and cbor-extract, which
      # the read-only `inspect` path does not use.
      - name: Install the workflow CLI
        run: >-
          npm install workflow@5.2.0 --no-save --no-audit --no-fund
          --ignore-scripts --prefix "$RUNNER_TEMP/workflow-cli"

      - name: Sync dependencies
        run: uv sync --all-packages --locked --python ${{ matrix.python-version }}

      # The installed AnyIO version is not in uv.lock, so it is exported for
      # Turborepo to hash.
      - name: Select AnyIO boundary
        run: |
          requirement=$(uv run --no-sync python scripts/anyio_version.py "$ANYIO_VERSION")
          uv pip install "$requirement"
          echo "CI_ANYIO=$requirement" >> "$GITHUB_ENV"

      - name: Restore Turborepo cache
        if: env.TURBO_RESTORE == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ env.TURBO_CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ env.TURBO_CACHE_KEY }}-

      - name: Test
        run: scripts/turbo.sh run poe:test --continue --summarize
        env:
          VERCEL_DEVALUE_JS: ${{ runner.temp }}/devalue
          VERCEL_WORKFLOW_CLI: ${{ runner.temp }}/workflow-cli/node_modules/workflow
          # For tests using pytest, dump thread stacks after 120 seconds to
          # diagnose hangs before the job timeout. ggt ignores this variable.
          PYTEST_ADDOPTS: -o faulthandler_timeout=120

      - name: Report Turborepo tasks
        if: ${{ !cancelled() }}
        run: uv run --no-sync python scripts/turbo_summary.py poe:test

      - name: Save Turborepo cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ env.TURBO_CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Test examples
        if: matrix.python-version == '3.12'
        run: uv run poe test-examples

  build:
    name: Build packages (anyio ${{ matrix.anyio }})
    strategy:
      fail-fast: false
      matrix:
        anyio: [lowest, latest]
    env:
      ANYIO_VERSION: ${{ matrix.anyio }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          enable-cache: false

      - name: Sync dependencies
        run: uv sync --all-packages --locked --python 3.12

      - name: Build package
        run: uv run poe dist

      - name: Test bundled packages with shared AnyIO
        run: |
          VERCEL_TEST_ANYIO=$(uv run --no-sync python scripts/anyio_version.py "$ANYIO_VERSION")
          export VERCEL_TEST_ANYIO
          for package in vercel-internal-core vercel-queue vercel-sandbox; do
            uv run python scripts/bundle_release.py test-wheel --package "$package" --dist-dir dist
          done

  release-dry-run:
    name: Release publish dry run
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          enable-cache: false
          python-version: '3.12'

      - name: Detect release packages
        id: plan
        run: >-
          uv run --locked python scripts/publish.py detect
          --base "${{ github.event.pull_request.base.sha }}"
          --output "${{ runner.temp }}/release-plan.json"

      - name: Build release packages
        if: steps.plan.outputs.packages != '[]'
        run: >-
          uv run --locked python scripts/publish.py build
          --plan "${{ runner.temp }}/release-plan.json"
          --build-dir "${{ runner.temp }}/publish-build"

      - name: Test publishing release packages
        if: steps.plan.outputs.packages != '[]'
        run: >-
          uv run --locked python scripts/publish.py publish
          --plan "${{ runner.temp }}/publish-build/plan.json"
          --build-dir "${{ runner.temp }}/publish-build"
          --dry-run

  overall:
    name: CI Overall
    if: always()
    needs:
      - build
      - lat-check
      - lint-and-typecheck
      - test
      - release-dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check CI results
        if: >-
          needs.build.result != 'success' ||
          needs.lat-check.result != 'success' ||
          needs.lint-and-typecheck.result != 'success' ||
          needs.test.result != 'success' ||
          (needs.release-dry-run.result != 'success' && needs.release-dry-run.result != 'skipped')
        run: exit 1
