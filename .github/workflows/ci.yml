name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  lint-test-and-build:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    environment: ci
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    services:
      # The vercel-apscheduler driver tests exercise their Lua scripts against
      # a real Redis; without this service they skip silently.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      APSCHEDULER_TEST_REDIS_URL: redis://localhost:6379/9
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false

      # The devalue interop tests run the real JS package against the Python
      # port. They skip when node is absent locally, but are mandatory here.
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # The interop tests fall back to `npm install devalue` when pointed at
      # nothing, but here we use a pinned checkout: it also carries the test
      # fixtures the tarball omits, and it keeps npm out of CI. `index.js` and
      # `src/` are byte-identical to the published package, so this ref is what
      # the port is actually verified against.
      #
      # Cloned outside the workspace deliberately. `actions/checkout` can only
      # write inside it, and a copy there puts devalue's own workflows under
      # our linters, where zizmor reports findings against them.
      - name: Checkout devalue
        run: >-
          git clone --depth 1 --branch v5.9.0
          https://github.com/sveltejs/devalue.git "$RUNNER_TEMP/devalue"

      # The local-world interop test runs the real `workflow` CLI against the
      # `.workflow-data` files the Python local world writes. Installed here
      # rather than left to the test's own npm fallback, so npm runs once per
      # job in a visible step instead of inside five test processes.
      #
      # A git checkout (as for devalue above) is not an option: the CLI is
      # TypeScript and needs a pnpm workspace install plus a tsc build, so the
      # published tarball is the practical artifact. `--ignore-scripts` skips
      # the native postinstalls of @swc/core, esbuild and cbor-extract, which
      # the read-only `inspect` path does not use.
      - name: Install the workflow CLI
        run: >-
          npm install workflow@5.0.0-beta.38 --no-save --no-audit --no-fund
          --ignore-scripts --prefix "$RUNNER_TEMP/workflow-cli"

      - name: Sync dependencies
        run: uv sync --all-packages --locked --python ${{ matrix.python-version }}

      - name: Lint
        run: ./scripts/lint.sh

      - name: Typecheck
        run: ./scripts/typecheck.sh

      - name: Test
        run: ./scripts/test.sh
        env:
          VERCEL_DEVALUE_JS: ${{ runner.temp }}/devalue
          VERCEL_WORKFLOW_CLI: ${{ runner.temp }}/workflow-cli/node_modules/workflow

      - name: Build package
        run: ./scripts/build.sh
