name: Publish PyPI

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and test publish candidates without publishing, tagging, or releasing.
        required: false
        default: false
        type: boolean
      force:
        description: Check every publish candidate, skipping versions that already exist.
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main

permissions: {}

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false
          python-version: '3.12'

      - name: Detect changed packages
        id: plan
        run: >-
          uv run --locked python scripts/publish.py detect
          --base "${{ github.event.before || 'HEAD^' }}"
          --output "${{ runner.temp }}/release-plan/plan.json"
          ${{ github.event_name == 'workflow_dispatch' && inputs.force && '--force' || '' }}

      - name: Upload release plan
        if: steps.plan.outputs.packages != '[]'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publish-plan
          path: ${{ runner.temp }}/release-plan/plan.json
          retention-days: 14

  build:
    needs: detect
    if: needs.detect.outputs.packages != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false
          python-version: '3.12'

      - name: Download release plan
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: publish-plan
          path: ${{ runner.temp }}/release-plan

      - name: Build and verify packages
        run: >-
          uv run --locked python scripts/publish.py build
          --plan "${{ runner.temp }}/release-plan/plan.json"
          --build-dir "${{ runner.temp }}/publish-build"

      - name: Upload built packages
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publish-packages
          path: ${{ runner.temp }}/publish-build
          retention-days: 14

  publish:
    needs: [detect, build]
    if: github.event_name == 'push' || !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment:
      name: pypi
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false
          python-version: '3.12'

      - name: Download built packages
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: publish-packages
          path: ${{ runner.temp }}/publish-build

      - name: Publish packages
        id: publish
        run: >-
          uv run --locked python scripts/publish.py publish
          --plan "${{ runner.temp }}/publish-build/plan.json"
          --build-dir "${{ runner.temp }}/publish-build"

      - name: Create Git Tags
        if: ${{ !cancelled() && steps.publish.outputs.tags != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAGS: ${{ steps.publish.outputs.tags }}
          RELEASE_BODIES: ${{ steps.publish.outputs.release-bodies }}
        with:
          script: |
            const fs = require('fs');
            const tags = process.env.TAGS.trim().split('\n').filter(Boolean);
            for (const tag of tags) {
              try {
                const ref = `tags/${tag}`;
                try {
                  await github.rest.git.getRef({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ref,
                  });
                  core.info(`Tag ${tag} already exists, skipping`);
                  continue;
                } catch (error) {
                  if (error.status !== 404) throw error;
                }

                const message = fs.readFileSync(`${process.env.RELEASE_BODIES}/${tag}.md`, 'utf8');
                const tagObject = await github.rest.git.createTag({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag,
                  message,
                  object: context.sha,
                  type: 'commit',
                });
                try {
                  await github.rest.git.createRef({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ref: `refs/${ref}`,
                    sha: tagObject.data.sha,
                  });
                } catch (error) {
                  if (error.status !== 422) throw error;
                  await github.rest.git.getRef({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ref,
                  });
                  core.info(`Tag ${tag} was created concurrently, skipping`);
                }
              } catch (error) {
                core.setFailed(`Failed to create tag ${tag}: ${error.message}`);
              }
            }

      - name: Create GitHub Releases
        if: ${{ !cancelled() && steps.publish.outputs.tags != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAGS: ${{ steps.publish.outputs.tags }}
          RELEASE_BODIES: ${{ steps.publish.outputs.release-bodies }}
        with:
          script: |
            const fs = require('fs');
            const tags = process.env.TAGS.trim().split('\n').filter(Boolean);
            for (const tag of tags) {
              try {
                const body = fs.readFileSync(`${process.env.RELEASE_BODIES}/${tag}.md`, 'utf8');
                await github.rest.repos.createRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_name: tag,
                  target_commitish: context.sha,
                  name: tag,
                  body,
                });
              } catch (error) {
                if (error.status !== 422) {
                  core.setFailed(`Failed to create release ${tag}: ${error.message}`);
                  continue;
                }
                try {
                  await github.rest.repos.getReleaseByTag({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    tag,
                  });
                  core.info(`Release ${tag} already exists, skipping`);
                } catch (lookupError) {
                  core.setFailed(`Failed to create release ${tag}: ${error.message}; ${lookupError.message}`);
                }
              }
            }

  dry-run:
    needs: [detect, build]
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false
          python-version: '3.12'

      - name: Download built packages
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: publish-packages
          path: ${{ runner.temp }}/publish-build

      - name: Test publishing packages
        run: >-
          uv run --locked python scripts/publish.py publish
          --plan "${{ runner.temp }}/publish-build/plan.json"
          --build-dir "${{ runner.temp }}/publish-build"
          --dry-run
