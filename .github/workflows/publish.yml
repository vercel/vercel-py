name: Publish PyPI

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and test publish candidates without publishing, tagging, or releasing.
        required: false
        default: false
        type: boolean
      force:
        description: Check every publish candidate, skipping versions that already exist.
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main

permissions: {}

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/publish
        id: plan
        with:
          base-ref: ${{ github.event.before || 'HEAD^' }}
          force: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
          detect-only: 'true'

  publish:
    needs: detect
    if: needs.detect.outputs.packages != '[]' && (github.event_name == 'push' || !inputs.dry_run)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment:
      name: pypi
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/publish
        with:
          plan: ${{ needs.detect.outputs.plan }}
          dry-run: 'false'

  dry-run:
    needs: detect
    if: needs.detect.outputs.packages != '[]' && github.event_name == 'workflow_dispatch' && inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/publish
        with:
          plan: ${{ needs.detect.outputs.plan }}
          dry-run: 'true'
