name: Build and publish matched packages
description: Detect, build, verify, and optionally publish the matched release set.

inputs:
  base-ref:
    description: Git revision to compare with HEAD when no frozen plan is supplied.
    default: HEAD^
  dry-run:
    description: Skip PyPI uploads, Git tags, and GitHub releases unless explicitly false.
    default: 'true'
  force:
    description: Inspect every publishable package without replacing existing versions.
    default: 'false'

  plan:
    description: Frozen JSON plan from a prior detection job; skips detection when supplied.
    default: ''
  detect-only:
    description: Emit the frozen plan without building or publishing.
    default: 'false'

outputs:
  plan:
    description: Frozen matched-package and shared-vendor release decisions.
    value: ${{ steps.packages.outputs.plan || inputs.plan }}
  packages:
    description: JSON array of matched package names.
    value: ${{ fromJSON(steps.packages.outputs.plan || inputs.plan || '{}').packages }}

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        enable-cache: false
        python-version: '3.12'

    - name: Detect changed packages
      id: packages
      if: inputs.plan == ''
      shell: bash
      env:
        BASE_REF: ${{ inputs.base-ref }}
        FORCE: ${{ inputs.force == 'true' }}
      run: uv run --locked python scripts/publish.py detect

    - name: Build and verify changed packages, then publish
      id: publish
      if: >-
        inputs.detect-only != 'true' &&
        fromJSON(steps.packages.outputs.plan || inputs.plan || '{}').packages != '[]'
      shell: bash
      env:
        PACKAGES_JSON: ${{ fromJSON(steps.packages.outputs.plan || inputs.plan).packages }}
        DRY_RUN: ${{ inputs.dry-run != 'false' }}
        PUBLISH_SHARED: ${{ fromJSON(steps.packages.outputs.plan || inputs.plan)['publish-shared'] }}
        SHARED_ERROR: ${{ fromJSON(steps.packages.outputs.plan || inputs.plan)['shared-error'] }}
        VERCEL_INTERNAL_SHARED_VENDORED_DEPS_VERSION: ${{ fromJSON(steps.packages.outputs.plan || inputs.plan)['shared-version'] }}
      run: uv run --locked python scripts/publish.py run

    - name: Create Git Tags
      if: ${{ !cancelled() && steps.publish.outputs.tags != '' && inputs.dry-run == 'false' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        TAGS: ${{ steps.publish.outputs.tags }}
        RELEASE_BODIES: ${{ steps.publish.outputs.release-bodies }}
      with:
        script: |
          const fs = require('fs');
          const tags = process.env.TAGS.trim().split('\n').filter(Boolean);
          for (const tag of tags) {
            try {
              const ref = `tags/${tag}`;
              try {
                await github.rest.git.getRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref,
                });
                core.info(`Tag ${tag} already exists, skipping`);
                continue;
              } catch (error) {
                if (error.status !== 404) throw error;
              }

              const message = fs.readFileSync(`${process.env.RELEASE_BODIES}/${tag}.md`, 'utf8');
              const tagObject = await github.rest.git.createTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
                message,
                object: context.sha,
                type: 'commit',
              });
              try {
                await github.rest.git.createRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `refs/${ref}`,
                  sha: tagObject.data.sha,
                });
              } catch (error) {
                if (error.status !== 422) throw error;
                await github.rest.git.getRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref,
                });
                core.info(`Tag ${tag} was created concurrently, skipping`);
              }
            } catch (error) {
              core.setFailed(`Failed to create tag ${tag}: ${error.message}`);
            }
          }

    - name: Create GitHub Releases
      if: ${{ !cancelled() && steps.publish.outputs.tags != '' && inputs.dry-run == 'false' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        TAGS: ${{ steps.publish.outputs.tags }}
        RELEASE_BODIES: ${{ steps.publish.outputs.release-bodies }}
      with:
        script: |
          const fs = require('fs');
          const tags = process.env.TAGS.trim().split('\n').filter(Boolean);
          for (const tag of tags) {
            try {
              const body = fs.readFileSync(`${process.env.RELEASE_BODIES}/${tag}.md`, 'utf8');
              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: tag,
                body,
              });
            } catch (error) {
              if (error.status !== 422) {
                core.setFailed(`Failed to create release ${tag}: ${error.message}`);
                continue;
              }
              try {
                await github.rest.repos.getReleaseByTag({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag,
                });
                core.info(`Release ${tag} already exists, skipping`);
              } catch (lookupError) {
                core.setFailed(`Failed to create release ${tag}: ${error.message}; ${lookupError.message}`);
              }
            }
          }
