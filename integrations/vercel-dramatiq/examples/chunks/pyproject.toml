[project]
name = "vercel-dramatiq-example-chunks"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "dramatiq>=2.2,<3",
    "fastapi",
    "vercel-cache>=0.7.0",
    "vercel-dramatiq>=0.7.0",
    "vercel-queue>=0.7.0",
]

[tool.uv]
package = false

# Compiles worker.py into a queue-triggered function. With no "topics"
# filter, the subscriber consumes every subscription introspected from the
# Dramatiq broker's declared queues, including delay queues.
[[tool.vercel.subscribers]]
entrypoint = "worker:broker"
