[build-system]
requires = ["hatchling>=1.27.0,<2"]
build-backend = "hatchling.build"

[project]
name = "vercel-apscheduler"
dynamic = ["version", "dependencies"]
description = "APScheduler integration for Vercel Schedules"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "LICENSE.*"]

[tool.hatch.metadata.hooks.custom]
path = "hatch_build.py"

[tool.vercel.release.dependencies]
dependencies = [
    "APScheduler>=3.10.4,<4",
    "anyio>=4.11.0,<5",
    "vercel-schedules",
]

[tool.uv.sources]
vercel-schedules = { workspace = true }

[tool.ruff]
extend = "../ruff.toml"

[tool.ruff.lint.per-file-ignores]
"examples/**/*.py" = [
    "D",
    "INP001",
    "T201",
]
"tests/**/*.py" = [
    "D",
    "S101",
    "SLF001",
    "PLC2701",
]
"vercel/integrations/apscheduler/_imports.py" = [
    "PLW0717",  # grouped optional APScheduler import guard.
]
"vercel/integrations/apscheduler/version.py" = [
    "D100",
]

[tool.pytest.ini_options]
addopts = "--no-header --capture=tee-sys"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.version]
path = "vercel/integrations/apscheduler/version.py"

[tool.hatch.build.targets.sdist]
force-include = { "../../scripts/hatch_build.py" = "/_vercel_hatch_build.py" }
include = [
    "/vercel/integrations/apscheduler/**/*.py",
    "/vercel/integrations/apscheduler/py.typed",
    "/README.md",
    "/hatch_build.py",
    "/examples/**/*.md",
    "/examples/**/*.py",
    "/examples/**/*.json",
    "/examples/**/*.toml",
    "/pyproject.toml",
    "/LICENSE",
]
exclude = [
    "/**/__pycache__",
]

[tool.hatch.build.targets.wheel]
dev-mode-dirs = ["."]
only-include = [
    "/vercel/integrations/apscheduler",
]
exclude = [
    "/**/__pycache__",
]

[tool.poe]
include = "../../scripts/poe/poe.toml"
verbosity = -1
